logging:
  level:
    root: WARN
    es.upm.api: INFO

app:
  hosting: render

spring:
  jpa:
    hibernate:
      ddl-auto: update
  # Valores creados en Render → Databases → Database → Connect
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}